<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Rusty Jump</title>
  <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #game { position: fixed; inset: 0; }
    canvas#bevy { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #loading, #rotate {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font: 600 20px system-ui, sans-serif; text-align: center; pointer-events: none;
    }
    #loading { background: #000; }
    #rotate { display: none; background: rgba(0,0,0,.75); }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"><canvas id="bevy" tabindex="0"></canvas></div>
  <div id="loading">載入中… Loading…</div>
  <div id="rotate">請把手機轉成橫向<br>Rotate to landscape</div>
  <script>
    addEventListener("TrunkApplicationStarted", () => {
      document.getElementById("loading").remove();
      document.getElementById("bevy").focus();
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
