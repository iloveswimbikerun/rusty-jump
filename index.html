<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Rusty Jump</title>
  
<script type="module">
import init, * as bindings from './rusty_jump-e8962c880aa314b6.js';
const wasm = await init({ module_or_path: './rusty_jump-e8962c880aa314b6_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #game { position: fixed; inset: 0; }
    canvas#bevy { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #loading, #rotate {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font: 600 20px system-ui, sans-serif; text-align: center; pointer-events: none;
    }
    #loading { background: #000; }
    #rotate { display: none; background: rgba(0,0,0,.75); }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
<link rel="modulepreload" href="./rusty_jump-e8962c880aa314b6.js" crossorigin="anonymous" integrity="sha384-ZGZsqNBSJ/M1bZ+kqemWQaPg44CxAUGSTV9MxmwnrVNpmnfiETwvu080wjUbU5xL"><link rel="preload" href="./rusty_jump-e8962c880aa314b6_bg.wasm" crossorigin="anonymous" integrity="sha384-e9UHsDS/QNuh3YHuX6lFtvFc35ZkBIQ7wzQCHc+m4ZWLbVuesLKqJaPJBJ3O96lp" as="fetch" type="application/wasm"></head>
<body>
  <div id="game"><canvas id="bevy" tabindex="0"></canvas></div>
  <div id="loading">載入中… Loading…</div>
  <div id="rotate">請把手機轉成橫向<br>Rotate to landscape</div>
  <script>
    addEventListener("TrunkApplicationStarted", () => {
      document.getElementById("loading").remove();
      document.getElementById("bevy").focus();
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
